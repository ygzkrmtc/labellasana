name: Testler

# Her push ve pull request'te, Windows ve Linux üzerinde birden çok Python
# sürümüyle tüm test paketini çalıştırır. Amaç: "bende çalışıyordu" durumunu
# ortadan kaldırmak ve hangi kombinasyonların gerçekten desteklendiğini
# kanıtlamak.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Qt için sistem kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ortam denetimi
        run: python check_env.py

      - name: Testler
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.run_all

  # Uygulamanın bağımlılıklar OLMADAN da açılabildiğini doğrular:
  # numpy/OpenCV/onnxruntime yokken menüler pasif olmalı, program çökmemeli.
  minimal:
    name: Sadece PyQt5 (isteğe bağlı paketler olmadan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt için sistem kütüphaneleri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      - name: Sadece PyQt5 kur
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt5>=5.15.9,<5.16"
      - name: Testler (isteğe bağlı olanlar atlanmalı)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.run_all
